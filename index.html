<head>

<title>Casa Ciompi</title>
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">

<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --card2:#f1eadd; --ink:#2b2622; --muted:#7a6f66; --line:#e6dccb;
  --accent:#e2673b; --accent-ink:#fff; --good:#3f9b6b; --warn:#d99a1e; --bad:#d2493c; --boss:#6d3fc0; --sky:#3b82c4;
  --shadow:0 1px 0 rgba(60,40,20,.04), 0 6px 18px -10px rgba(60,40,20,.25);
  --r:18px; --head:Fredoka,Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1916; --card:#26221e; --card2:#2f2a25; --ink:#f2ebe1; --muted:#a99d90; --line:#3a342e;
    --accent:#ef7a4f; --good:#55b583; --warn:#e5ac38; --bad:#e2665a; --boss:#a27ae8; --sky:#5b9fdc; --shadow:0 6px 18px -10px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.num{font-family:var(--head);font-weight:600;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.top h1{font-size:26px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.weak{background:color-mix(in srgb,var(--boss) 15%,transparent);color:var(--boss)}
.pill.pause{background:color-mix(in srgb,var(--sky) 15%,transparent);color:var(--sky)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:800;background:var(--card2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.small{padding:7px 11px;font-size:14px;border-radius:11px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.mt{margin-top:12px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:800;color:var(--muted);border-radius:12px;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .ic{filter:none;opacity:1}
nav.tabs .badge{position:absolute;left:calc(50% + 6px);top:0;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px}

.house{display:flex;gap:16px;align-items:center}
.gauge{position:relative;width:132px;flex:none}
.gauge svg{display:block;width:100%}
.gauge .val{position:absolute;inset:auto 0 4px 0;text-align:center}
.gauge .val .num{font-size:30px;line-height:1}
.catbars{flex:1;display:grid;gap:7px;min-width:0}
.catbar{font-size:12px;font-weight:700}
.catbar .lbl{display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:9px}

.boss .face{font-size:54px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.boss.dead .face{filter:grayscale(1);opacity:.55;transform:rotate(-12deg)}
.hp{height:16px;border-radius:10px;background:var(--card2);overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.hp>i{display:block;height:100%;background:linear-gradient(90deg,var(--boss),color-mix(in srgb,var(--boss) 60%,var(--bad)));transition:width .6s}
.taunt{font-style:italic;font-size:14px;color:var(--muted);margin-top:2px}
.pace{font-size:13px;font-weight:700;margin-top:6px}

.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.pl .av{margin:0 auto 6px}
.pl .name{font-weight:800;font-size:14px}
.pl .num{font-size:28px}
.av{border-radius:50%;display:grid;place-items:center;flex:none}
.vs{font-family:var(--head);color:var(--muted);font-size:14px}
.split{height:10px;border-radius:9px;overflow:hidden;display:flex;margin-top:12px;background:var(--card2)}
.split i{display:block;height:100%}

.sec{font-family:var(--head);font-weight:600;font-size:15px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.sec .c{font-family:Nunito,system-ui,sans-serif;font-size:12px;color:var(--muted);font-weight:800}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;width:100%;text-align:left;box-shadow:var(--shadow)}
.task .dot{width:10px;height:10px;border-radius:50%;flex:none}
.task .nm{font-weight:800;font-size:15px;line-height:1.25}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px}
.task .pts{text-align:right;flex:none}
.task .pts .num{font-size:20px}
.task .pts small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;margin:0 -16px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.log{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log .em{font-size:20px;min-width:28px;text-align:center}
.log .t{font-weight:700;font-size:14px}
.log .d{font-size:12px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet h2{font-size:22px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.who .btn{flex-direction:column;padding:14px 8px;gap:4px}
.who .btn .e{font-size:28px}
.who .wide{grid-column:1/-1;flex-direction:row}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv b{font-weight:800;text-align:right}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;font-size:20px;display:grid;place-items:center;background:var(--card2)}
.swatches button.on{border-color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;flex:1;min-width:30%}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px}
.seg input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.check{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-weight:700;font-size:14px;margin:0;color:var(--ink)}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:800;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:pop .25s;max-width:92vw;text-align:center}
.burst{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.burst span{position:absolute;font-size:26px;animation:fly 1.4s ease-out forwards}
.burst i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
.login{max-width:400px;margin:8vh auto 0;padding:16px}
.logo{font-size:64px;text-align:center}
.center{text-align:center}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:50vh;white-space:pre}
.fame{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.switch input{width:auto;transform:scale(1.3)}
.banner-pause{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--sky) 14%,var(--card));border:1px solid color-mix(in srgb,var(--sky) 35%,transparent);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:14px}

.ach{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ach:first-child{border-top:0}
.ach .nm{font-weight:800;font-size:15px;line-height:1.2}
.ach.locked .nm{color:var(--muted)}
.ach .ds{font-size:12px;color:var(--muted);margin-top:2px}
.ach .pg{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;font-weight:800;color:var(--muted)}
.ach .pg .bar{flex:1;margin:0;height:6px}
.ach .bdg{flex:none}
.ach.locked .bdg{filter:grayscale(1);opacity:.4}
.ach .when{font-size:11px;color:var(--good);font-weight:800;margin-top:4px}
.grp{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.grp h2{margin:0}
.dice{font-size:44px;display:inline-block}
.slot{font-family:var(--head);font-size:22px;font-weight:600;min-height:60px;display:grid;place-items:center;text-align:center;padding:0 10px}

.prize{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,200,90,.35),rgba(20,14,8,.7));animation:fade .25s;padding:20px}
.prize .box{position:relative;background:var(--card);border-radius:28px;padding:28px 22px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:zoomin .5s cubic-bezier(.2,1.4,.4,1)}
.prize .x{position:absolute;top:10px;right:12px;font-size:22px;color:var(--muted);padding:6px}
.prize .rays{position:relative;width:170px;height:170px;margin:0 auto 6px;display:grid;place-items:center}
.prize .rays::before{content:"";position:absolute;inset:-20px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,196,60,.45) 0 10deg,transparent 10deg 24deg);animation:spin 9s linear infinite;mask:radial-gradient(circle,#000 35%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%)}
.prize .rays svg{position:relative;animation:wobble 1.2s ease-in-out .4s}
.prize .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.prize h2{font-size:24px;margin:6px 0 6px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,10px) scale(.9);opacity:0}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes zoomin{from{transform:scale(.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wobble{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.08)}50%{transform:rotate(8deg) scale(1.12)}75%{transform:rotate(-4deg) scale(1.04)}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round(n*10)/10;
const fmt = n => r1(n).toLocaleString('it-IT');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const pad = n => String(n).padStart(2,'0');
const monthKey = t => { const d=new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const dateKey = t => { const d=new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const keyToMs = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d||1).getTime(); };
const addDays = (k,n) => { const [y,m,d]=k.split('-').map(Number); return dateKey(new Date(y,m-1,d+n).getTime()); };
const startOfMonth = t => { const d=new Date(t); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const endOfMonth = t => { const d=new Date(t); return new Date(d.getFullYear(), d.getMonth()+1, 1).getTime(); };
const monthName = k => { const [y,m]=k.split('-'); const s=new Date(+y,+m-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'}); return s[0].toUpperCase()+s.slice(1); };
const monthShort = k => monthName(k).split(' ')[0].toLowerCase();
const dayStart = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fmtDay = k => new Date(keyToMs(k)).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
function relDay(t){
  if (t==null) return 'mai';
  const diff = Math.round((dayStart(Date.now())-dayStart(t))/DAY);
  if (diff===0) return 'oggi'; if (diff===1) return 'ieri'; if (diff>1 && diff<7) return diff+' giorni fa';
  return new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
}
const hhmm = t => new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
function freqLabel(d){
  if (!d) return 'senza scadenza';
  if (d===1) return 'ogni giorno';
  if (d%30===0) return d===30 ? 'ogni mese' : `ogni ${d/30} mesi`;
  if (d%7===0) return d===7 ? 'ogni settimana' : `ogni ${d/7} settimane`;
  return `ogni ${d} giorni`;
}
const isObj = v => v && typeof v==='object' && !Array.isArray(v);
const deepMerge = (a,b) => { const o={...(a||{})}; for (const [k,v] of Object.entries(b||{})) o[k] = (isObj(v) && isObj(o[k])) ? deepMerge(o[k],v) : v; return o; };
const deepAdd = (a,b) => { const o={...(a||{})}; for (const [k,v] of Object.entries(b||{})) o[k] = isObj(v) ? deepAdd(isObj(o[k])?o[k]:{}, v) : (+(o[k]||0) + v); return o; };
const localInput = t => new Date(t - new Date(t).getTimezoneOffset()*60000).toISOString().slice(0,16);

/* ---------------- archivio dati: Firebase o demo ---------------- */
const COLS = ['tasks','completions','months','stats','achievements','daily'];
async function firebaseStore(cfg){
  const B = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [A, AU, F] = await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
  const app = A.initializeApp(cfg);
  const auth = AU.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch(e){ db = F.getFirestore(app); }
  const list = s => s.docs.map(d => ({id:d.id, ...d.data()}));
  const toInc = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, isObj(v) ? toInc(v) : F.increment(v)]));
  return {
    mode:'firebase',
    onAuth: cb => AU.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid, email:u.email} : null)),
    signIn: (e,p) => AU.signInWithEmailAndPassword(auth,e,p),
    signUp: (e,p) => AU.createUserWithEmailAndPassword(auth,e,p),
    reset: e => AU.sendPasswordResetEmail(auth,e),
    signOut: () => AU.signOut(auth),
    subscribe(q, h, onErr){
      // includeMetadataChanges: serve per sapere quando i dati arrivano davvero dal server
      // (senza, una raccolta vuota resta "da cache" per sempre e i premi non partono)
      const on = (ref, fn) => F.onSnapshot(ref, {includeMetadataChanges:true}, s => fn(s, s.metadata.fromCache), onErr);
      const u = [
        on(F.collection(db,'tasks'), (s,c) => h.tasks(list(s), c)),
        on(F.query(F.collection(db,'completions'), F.where('at','>=',q.since)), (s,c) => h.completions(list(s), c)),
        on(F.doc(db,'config','main'), (s,c) => h.config(s.exists() ? s.data() : null, c)),
        on(F.collection(db,'months'), (s,c) => h.months(list(s), c)),
        on(F.collection(db,'stats'), (s,c) => h.stats(list(s), c)),
        on(F.collection(db,'achievements'), (s,c) => h.achievements(list(s), c)),
        on(F.query(F.collection(db,'daily'), F.where('date','>=',q.dailySince)), (s,c) => h.daily(list(s), c))
      ];
      return () => u.forEach(f => f());
    },
    async commit(ops){
      for (let i=0; i<ops.length; i+=450){
        const b = F.writeBatch(db);
        for (const op of ops.slice(i,i+450)){
          const ref = F.doc(db, op.col, op.id);
          if (op.type==='set') b.set(ref, op.data, {merge: !!op.merge});
          else if (op.type==='inc') b.set(ref, toInc(op.data), {merge:true});
          else if (op.type==='delete') b.delete(ref);
        }
        await b.commit();
      }
    },
    newId: col => F.doc(F.collection(db,col)).id,
    allCompletions: async () => list(await F.getDocs(F.collection(db,'completions'))),
    async dumpAll(){
      const out = {};
      for (const c of [...COLS,'config']) out[c] = list(await F.getDocs(F.collection(db,c)));
      return out;
    }
  };
}
function demoStore(){
  const K='casaciompi-demo-v2';
  const empty = () => Object.fromEntries([...COLS,'config'].map(c => [c,{}]));
  let st; try { st = JSON.parse(localStorage.getItem(K)); } catch(e){}
  st = {...empty(), ...(st||{})};
  const users = [{uid:'demo-a', email:'tu@demo'}, {uid:'demo-b', email:'lei@demo'}];
  let who = 0; try { who = +localStorage.getItem(K+'-who') || 0; } catch(e){}
  let h = null, authCb = null;
  const save = () => { try { localStorage.setItem(K, JSON.stringify(st)); } catch(e){} };
  const arr = col => Object.entries(st[col]).map(([id,d]) => ({id, ...d}));
  const emit = () => { if (!h) return; COLS.forEach(c => h[c](arr(c), false)); h.config(st.config.main||null, false); };
  return {
    mode:'demo',
    onAuth(cb){ authCb = cb; setTimeout(() => cb(users[who])); },
    switchUser(){ who = 1-who; try { localStorage.setItem(K+'-who', who); } catch(e){} authCb(users[who]); },
    resetDemo(){ st = empty(); save(); location.reload(); },
    signOut(){ this.switchUser(); },
    subscribe(q, handlers){ h = handlers; setTimeout(emit); return () => { h = null; }; },
    async commit(ops){
      for (const op of ops){
        if (op.type==='set') st[op.col][op.id] = op.merge ? deepMerge(st[op.col][op.id], op.data) : JSON.parse(JSON.stringify(op.data));
        else if (op.type==='inc') st[op.col][op.id] = deepAdd(st[op.col][op.id], op.data);
        else if (op.type==='delete') delete st[op.col][op.id];
      }
      save(); emit();
    },
    newId: () => Math.random().toString(36).slice(2,12)+Date.now().toString(36),
    allCompletions: async () => arr('completions'),
    async dumpAll(){ return Object.fromEntries([...COLS,'config'].map(c => [c, arr(c)])); }
  };
}

/* ---------------- vacanze ---------------- */
const pauses = () => S.config?.pauses || [];
const pauseRanges = () => pauses().map(p => [keyToMs(p.from), keyToMs(addDays(p.to,1))]).filter(([a,b]) => b > a);
function pausedOverlap(a, b){ let s = 0; for (const [x,y] of pauseRanges()){ const lo=Math.max(a,x), hi=Math.min(b,y); if (hi>lo) s += hi-lo; } return s; }
const effElapsed = (a, b) => b <= a ? 0 : (b-a) - pausedOverlap(a, b);
function dueFrom(last, span){ let t = last + span; for (let i=0; i<30; i++){ const t2 = last + span + pausedOverlap(last, t); if (t2 === t) break; t = t2; } return t; }
const isPausedDay = k => { const t = keyToMs(k) + DAY/2; return pauseRanges().some(([a,b]) => t>=a && t<b); };
const currentPause = () => { const now = Date.now(); return pauses().find(p => now >= keyToMs(p.from) && now < keyToMs(addDays(p.to,1))); };

/* ---------------- regole di punteggio ---------------- */
function taskState(t, now = Date.now()){
  const set = settings();
  if (!t.freqDays) return {kind:'free', mult:1, health:null, status:'free', dueAt:null, note:''};
  const span = t.freqDays*DAY;
  const r = t.lastDoneAt == null ? 1 : effElapsed(t.lastDoneAt, now) / span;
  const dueAt = t.lastDoneAt == null ? now : dueFrom(t.lastDoneAt, span);
  let mult = 1, note = '';
  if (r < set.earlyThreshold && (dueAt-now)/DAY > 2){ mult = set.earlyMult; note = `fatta da poco: vale ${Math.round(set.earlyMult*100)}%`; }
  else if (r > 1){ const b = Math.min(set.overdueMaxBonus, (r-1)*set.overdueMaxBonus); mult = 1+b; note = `bonus ritardo +${Math.round(b*100)}%`; }
  // pulizia: 100% appena fatta, 50% alla scadenza, 0% dopo un periodo intero di ritardo
  const health = Math.max(0, 1 - r/2);
  const dd = Math.round((dayStart(dueAt) - dayStart(now)) / DAY);
  const status = r > 1 ? 'late' : dd <= 1 ? 'soon' : 'ok';
  return {kind:'timed', r, mult, health, status, dueAt, note};
}
function dueLabel(st){
  if (st.kind === 'free') return 'quando serve';
  const d = Math.round((dayStart(st.dueAt) - dayStart(Date.now())) / DAY);
  if (d < 0) return `in ritardo di ${-d} ${-d===1?'giorno':'giorni'}`;
  if (d === 0) return 'scade oggi';
  if (d === 1) return 'scade domani';
  return `tra ${d} giorni`;
}
function houseHealth(){
  const cats = {}; let w = 0, s = 0;
  for (const t of activeTasks()){
    const st = taskState(t); if (st.kind !== 'timed') continue;
    const wt = t.points || 1; w += wt; s += wt*st.health;
    const c = cats[t.category] ||= {w:0, s:0}; c.w += wt; c.s += wt*st.health;
  }
  return {pct: w ? Math.round(s/w*100) : 100, cats: categories().filter(c => cats[c]).map(c => ({name:c, pct:Math.round(cats[c].s/cats[c].w*100)}))};
}
const healthColor = p => p >= 70 ? 'var(--good)' : p >= 50 ? 'var(--warn)' : 'var(--bad)';
function monthData(key){
  const comps = S.completions.filter(c => c.month === key && !isReset(c));
  const scores = {}, counts = {}; let together = 0, damage = 0;
  for (const c of comps){
    for (const [uid,p] of Object.entries(c.awards || {})){ scores[uid] = (scores[uid]||0) + p; counts[uid] = (counts[uid]||0) + 1; }
    if ((c.byUids||[]).length > 1) together++;
    damage += c.damage || 0;
  }
  return {comps, scores, counts, together, damage};
}
function expectedMonthly(){ return activeTasks().filter(t => t.freqDays).reduce((s,t) => s + t.points*30/t.freqDays, 0); }
function bossOf(key){ const [y,m] = key.split('-').map(Number); return BOSSES[((y*12 + m-1)*7) % BOSSES.length]; }
function bossInfo(key){
  const b = bossOf(key);
  const weak = categories().includes(b.weak) ? b.weak : null;
  const s0 = keyToMs(key+'-01'), e0 = endOfMonth(s0);
  // il primo mese (e i giorni di vacanza) rendono il boss più debole in proporzione
  const start = Math.min(Math.max(s0, S.config?.startedAt || s0), e0 - DAY);
  const active = Math.max(DAY, effElapsed(start, e0));
  const hp = Math.max(10, Math.round(expectedMonthly()*settings().bossDifficulty*active/(e0-s0)));
  return {...b, weak, start, end:e0, active, hp};
}
function bossDefeatDay(key){
  const b = bossInfo(key); let dmg = 0;
  for (const c of monthData(key).comps.sort((x,y) => x.at-y.at)){ dmg += c.damage||0; if (dmg >= b.hp) return new Date(c.at).getDate(); }
  return null;
}

function statDelta(c, sign = 1){
  const out = {}; if (!c || isReset(c)) return out;
  const dk = dateKey(c.at), h = new Date(c.at).getHours(), both = (c.byUids||[]).length > 1;
  for (const uid of c.byUids || []){
    const p = (c.awards||{})[uid] || 0;
    const d = {total:sign, points:sign*p, perTask:{[c.taskId]:sign}, perCat:{[c.category]:sign*p}, days:{[dk]:{n:sign, p:sign*p}}};
    if (both){ d.together = sign; d.togetherCat = {[c.category]:sign}; }
    if ((c.mult||1) >= 1.25) d.rescues = sign;
    if (h >= 4 && h < 8) d.early = sign;
    if (h >= 23 || h < 4) d.night = sign;
    if (c.finalBlow) d.finals = sign;
    out[uid] = d;
  }
  return out;
}
function statOps(...deltas){
  const acc = {}; for (const d of deltas) for (const [uid,v] of Object.entries(d)) acc[uid] = deepAdd(acc[uid], v);
  return Object.entries(acc).map(([uid,data]) => ({type:'inc', col:'stats', id:uid, data}));
}
function lastDoneFor(taskId, comps, fallback){
  const cs = comps.filter(c => c.taskId === taskId);
  if (!cs.length) return fallback;
  const l = cs.reduce((a,b) => b.at > a.at ? b : a);
  return {lastDoneAt:l.at, lastDoneBy:l.byUids||[]};
}

function makeCompletion(t, uids, at, mult){
  const set = settings(), key = monthKey(at), boss = bossInfo(key);
  const value = t.points * mult, share = uids.length > 1 ? set.coopShare : 1;
  const awards = {}; uids.forEach(u => awards[u] = r1(value*share));
  const total = Object.values(awards).reduce((a,b) => a+b, 0);
  const weakHit = !!(boss.weak && boss.weak === t.category);
  return {taskId:t.id, taskName:t.name, category:t.category, byUids:uids, awards, base:t.points, mult:Math.round(mult*100)/100,
          damage:r1(total * (weakHit ? set.weaknessMult : 1)), at, month:key, type: uids.length ? 'done' : 'reset', weakHit};
}
function completeTask(taskId, uids){
  const t = S.tasks.find(x => x.id === taskId); if (!t) return;
  const now = Date.now(), st = taskState(t, now), key = monthKey(now), boss = bossInfo(key);
  const c = makeCompletion(t, uids, now, st.mult);
  const before = monthData(key).damage;
  c.finalBlow = before < boss.hp && before + c.damage >= boss.hp;
  Object.assign(c, {loggedBy:S.user.uid, prevLastDoneAt:t.lastDoneAt ?? null, prevLastDoneBy:t.lastDoneBy ?? null});
  delete c.weakHit;
  const id = store.newId('completions');
  store.commit([
    {type:'set', col:'completions', id, data:c},
    {type:'set', col:'tasks', id:t.id, data:{lastDoneAt:now, lastDoneBy:uids}, merge:true},
    ...statOps(statDelta(c))
  ]).catch(err => toast('⚠️ Errore nel salvataggio: '+err.message));
  closeModal();
  toast(`+${fmt(c.awards[uids[0]])} punti${uids.length>1?' a testa':''} · −${fmt(c.damage)} HP${boss.weak===t.category?' 💥':''}`);
  burst(uids.length > 1 ? ['💞','✨','🧽'] : ['✨','🧽','⭐']);
  if (c.finalBlow) setTimeout(() => { confetti(); toast(`${boss.emoji} ${boss.name} è stato sconfitto! 🎉`); }, 900);
}
function resetTasks(ids, at){
  const ops = [];
  for (const id of ids){
    const t = S.tasks.find(x => x.id === id); if (!t) continue;
    const c = {taskId:t.id, taskName:t.name, category:t.category, byUids:[], awards:{}, base:t.points, mult:1, damage:0, at, month:monthKey(at),
               type:'reset', loggedBy:S.user.uid, prevLastDoneAt:t.lastDoneAt ?? null, prevLastDoneBy:t.lastDoneBy ?? null};
    ops.push({type:'set', col:'completions', id:store.newId('completions'), data:c});
    if (!t.lastDoneAt || at >= t.lastDoneAt) ops.push({type:'set', col:'tasks', id:t.id, data:{lastDoneAt:at, lastDoneBy:[]}, merge:true});
  }
  if (!ops.length) return;
  store.commit(ops).catch(err => toast('⚠️ '+err.message));
  closeModal(); toast(`🔄 ${ids.length === 1 ? 'Attività azzerata' : ids.length+' attività azzerate'}`);
}
function deleteCompletion(id){
  const c = S.completions.find(x => x.id === id); if (!c) return;
  const sim = S.completions.filter(x => x.id !== id);
  const ops = [{type:'delete', col:'completions', id}, ...statOps(statDelta(c, -1))];
  if (S.tasks.some(t => t.id === c.taskId))
    ops.push({type:'set', col:'tasks', id:c.taskId, data:lastDoneFor(c.taskId, sim, {lastDoneAt:c.prevLastDoneAt ?? null, lastDoneBy:c.prevLastDoneBy ?? null}), merge:true});
  store.commit(ops).catch(err => toast('⚠️ '+err.message));
  closeModal(); toast('Eliminata ↩️');
}
function saveCompletionEdit(id, f){
  const old = S.completions.find(x => x.id === id); if (!old) return;
  const v = Object.fromEntries(new FormData(f));
  const t = S.tasks.find(x => x.id === v.task); if (!t) return;
  const o = other();
  const uids = v.who==='me' ? [S.user.uid] : v.who==='other' ? [o.uid] : v.who==='both' ? [S.user.uid, o.uid] : [];
  const at = new Date(v.at).getTime(); if (!at) return toast('Data non valida');
  const mult = isReset(old) ? 1 : (old.mult || 1);

  delete nc.id; delete nc.weakHit;
  if (t.id !== old.taskId){ nc.prevLastDoneAt = t.lastDoneAt ?? null; nc.prevLastDoneBy = t.lastDoneBy ?? null; }
  if (nc.type === 'reset') nc.finalBlow = false;
  const sim = S.completions.map(x => x.id === id ? {...nc, id} : x);
  const ops = [{type:'set', col:'completions', id, data:nc}, ...statOps(statDelta(old, -1), statDelta(nc))];

    ops.push({type:'set', col:'tasks', id:tid, data:lastDoneFor(tid, sim, {lastDoneAt:old.prevLastDoneAt ?? null, lastDoneBy:old.prevLastDoneBy ?? null}), merge:true});

  closeModal(); toast('Modificata ✅');
}

function upgradeIfNeeded(){
  if (!(S.server.config && S.server.tasks && S.server.completions) || !S.config?.seeded || S.config?.startV2 || S._upgrading) return;
  S._upgrading = true;
  const now = Date.now(), ops = [];
  for (const t of S.tasks) if (t.freqDays && !(t.lastDoneBy && t.lastDoneBy.length))
    ops.push({type:'set', col:'tasks', id:t.id, data:{lastDoneAt:startLast(t.freqDays, now)}, merge:true});
  // ricostruisce le statistiche dei premi dallo storico caricato
  const acc = {}; for (const c of S.completions) for (const [uid,d] of Object.entries(statDelta(c))) acc[uid] = deepAdd(acc[uid], d);
  for (const [uid,data] of Object.entries(acc)) ops.push({type:'set', col:'stats', id:uid, data});
  const cfg = {startV2:true, startedAt:now};
  if (settings().earlyThreshold === 0.5) cfg.settings = {...settings(), earlyThreshold:0.4};
  ops.push({type:'set', col:'config', id:'main', data:cfg, merge:true});

  return list.map(([target, name, emoji, desc], i) => ({id:`${group}-${extra.key||'x'}-${target}`, group, scope, name, emoji, desc,

function taskTargets(t){
  const freq = t.freqDays || 1.5, ppy = 365/freq/2;
  const pf = Math.min(1.4, Math.max(0.7, Math.sqrt(3/Math.max(0.5, t.points))));
  const T = [0.05, 0.25, 0.75, 2], MIN = [1, 2, 3, 5]; let prev = 0;
  return T.map((x,i) => { let v = Math.max(MIN[i], Math.round(ppy*x*pf)); if (v <= prev) v = prev+1; prev = v; return v; });

}

  const houseStreak = {}; let housePeak = 0;
  S.daily.forEach(d => housePeak = Math.max(housePeak, d.max ?? 0));
  for (const th of [60,70,80]){
    let last = null;
    houseStreak[th] = bestRun(keys[0], today, k => {
      if (isPausedDay(k)) return null;
      let v = daily[k] ? daily[k].min : null;
      if (v == null){ let nk = addDays(k,1), nv = null; for (let j=0; j<30 && nk <= today; j++){ if (daily[nk]){ nv = daily[nk].min; break; } nk = addDays(nk,1); }
        v = Math.min(last ?? 100, nv ?? last ?? 0); }
      last = v; return v >= th;
    }, k => addDays(k,1));
  }
  let bothDays = 0;
  if (ps.length > 1){ const [a,b] = ps.map(p => S.stats.find(s => s.id === p.uid)?.days || {});
    bothDays = Object.keys(a).filter(k => (a[k]?.n||0) > 0 && (b[k]?.n||0) > 0).length; }
  const cur = monthKey(Date.now()), curDay = bossDefeatDay(cur);
  const bosses = S.months.filter(m => m.bossDefeated && m.id !== cur).length + (curDay ? 1 : 0);
  const days = [...S.months.filter(m => m.bossDefeated && m.bossDefeatDay && m.id !== cur).map(m => m.bossDefeatDay), curDay].filter(Boolean);
  const v = {houseStreak, housePeak, bothDays, bosses, fastest: days.length ? Math.min(...days) : null};
  S._coupleCtx = {sig:S._dataSig, v}; return v;
}
function achCtx(uid){
  const st = S.stats.find(s => s.id === uid) || {};
  const days = st.days || {}, today = dateKey(Date.now());
  const dk = Object.keys(days).filter(k => (days[k]?.n||0) > 0).sort();
  const bestStreak = bestRun(dk[0], today, k => isPausedDay(k) ? null : (days[k]?.n||0) > 0 ? true : (k === today ? null : false), k => addDays(k,1));
  const weeks = {}; dk.forEach(k => { const w = weekKey(k); weeks[w] = (weeks[w]||0) + days[k].n; });
  const wk = Object.keys(weeks).sort(), thisWeek = weekKey(today);
  const bestWeeks = bestRun(wk[0], thisWeek, k => (weeks[k]||0) >= 10 ? true : (k === thisWeek ? null : false), k => addDays(k,7));
  let maxDayN = 0, maxDayP = 0, weekend = 0;
  dk.forEach(k => { maxDayN = Math.max(maxDayN, days[k].n); maxDayP = Math.max(maxDayP, days[k].p||0);
    const wd = new Date(keyToMs(k)).getDay();
    if (wd === 6) weekend = Math.max(weekend, days[k].n + (days[addDays(k,1)]?.n||0));
    if (wd === 0) weekend = Math.max(weekend, days[k].n + (days[addDays(k,-1)]?.n||0)); });
  const perTask = st.perTask || {}, act = activeTasks();
  const distinct = act.filter(t => (perTask[t.id]||0) > 0).length;
  return {total:st.total||0, points:r1(st.points||0), perTask, perCat:st.perCat||{}, together:st.together||0, togetherCat:st.togetherCat||{},
    rescues:st.rescues||0, early:st.early||0, night:st.night||0, finals:st.finals||0, bestStreak, bestWeeks, maxDayN, maxDayP:r1(maxDayP), weekend,
    distinct: distinct === act.length && act.length ? Math.max(26, act.length) : distinct,
    wins: S.months.filter(m => m.winner === uid).length, ...coupleCtx()};
}
function evaluate(uid){
  const ctx = achCtx(uid), stored = S.achievements.find(a => a.id === uid)?.unlocked || {};
  // un premio è sbloccato solo se i dati attuali lo giustificano: se un'attività viene annullata o eliminata, il premio torna bloccato
  return achievementsList().map(a => { const v = Math.max(0, a.metric(ctx) || 0); const done = v >= a.target;
    return {...a, value:v, done, when: done ? (stored[a.id] || null) : null, pct: done ? 100 : Math.min(99, Math.floor(v/a.target*100))}; });
}
function checkUnlocks(){
  const need = ['config','tasks','completions','stats','achievements','months','daily'];
  if (!need.every(k => S.server[k]) || !me()) return;
  const uid = S.user.uid, stored = S.achievements.find(a => a.id === uid)?.unlocked || {};
  const res = evaluate(uid), byId = Object.fromEntries(res.map(a => [a.id, a]));
  const revoked = Object.keys(stored).filter(id => !byId[id]?.done);
  const fresh = res.filter(a => a.done && !a.when && !S._shown.has(a.id));
  revoked.forEach(id => S._shown.delete(id));
  if (!fresh.length && !revoked.length) return;
  fresh.forEach(a => S._shown.add(a.id));
  const now = Date.now();
  const unlocked = Object.fromEntries(Object.entries(stored).filter(([id]) => !revoked.includes(id)));
  fresh.forEach(a => unlocked[a.id] = now);
  // riscrive l'elenco completo, così i premi non più validi vengono tolti
  store.commit([{type:'set', col:'achievements', id:uid, data:{unlocked}}]).catch(()=>{});
  if (revoked.length && !fresh.length) toast(`🏅 ${revoked.length === 1 ? 'Un premio è tornato bloccato' : revoked.length+' premi sono tornati bloccati'} dopo la modifica`);
  if (!fresh.length) return;
  const show = [...fresh].sort((a,b) => b.tier - a.tier).slice(0, 3);
  S._prizeQueue.push(...show.map((a,i) => ({...a, more: i === show.length-1 ? fresh.length - show.length : 0})));
  if (!$('#prize').innerHTML) setTimeout(nextPrize, 700);
}

function pickTask(){
  // pesca tra le attività che scadono entro 3 settimane (o già in ritardo), escluse quelle fatte oggi o ieri
  const now = Date.now(), yesterday = dayStart(now) - DAY;
  let pool = activeTasks().map(t => ({t, st:taskState(t)}))
    .filter(x => x.st.kind === 'timed' && x.st.dueAt <= now + 21*DAY && !(x.t.lastDoneAt && x.t.lastDoneAt >= yesterday));
  if (pool.length > 1) pool = pool.filter(x => x.t.id !== S._lastPick);
  if (!pool.length) return toast('Nessuna attività da estrarre');
  // più è vicina la scadenza (o più è in ritardo) e più punti vale, più è probabile
  const weights = pool.map(x => { const left = (x.st.dueAt - now)/DAY;
    return (x.t.points * x.st.mult + 1) * (left <= 0 ? 3 : 1 + 2*(1 - Math.min(left, 21)/21)); });
  let r = Math.random() * weights.reduce((a,b) => a+b, 0), pick = pool[0];
  for (let i=0; i<pool.length; i++){ r -= weights[i]; if (r <= 0){ pick = pool[i]; break; } }
  S._lastPick = pick.t.id;
  openModal(`<div class="center"><div class="dice" id="dice">🎲</div><h2 class="mt">L'estrazione dice…</h2>
    <div class="slot" id="slot"></div><div id="slotMeta" class="sub" style="min-height:22px"></div>
    <div class="row mt" style="gap:10px" id="slotBtns"></div></div>`);
  let i = 0; const names = pool.map(x => x.t.name);
  clearInterval(S._slotTimer);
  S._slotTimer = setInterval(() => { const el = $('#slot'); if (!el) return clearInterval(S._slotTimer); el.textContent = names[i++ % names.length]; $('#dice').style.transform = `rotate(${i*47}deg)`; }, 70);
  setTimeout(() => {
    clearInterval(S._slotTimer); if (!$('#slot')) return;
    $('#slot').textContent = pick.t.name; $('#dice').style.transform = '';
    $('#slotMeta').innerHTML = `${esc(pick.t.category)} · <span class="pill ${pick.st.status}">${dueLabel(pick.st)}</span> · <b>${fmt(pick.t.points*pick.st.mult)} punti</b>`;
    $('#slotBtns').innerHTML = `<button class="btn grow" data-act="pick">🎲 Un'altra</button><button class="btn primary grow" data-act="open" data-id="${pick.t.id}">Fatta! ✅</button>`;
    burst(['🎲','✨'], 8);
  }, 1300);
}

function confirmBox(text, act, id, label='Conferma'){
  openModal(`<h2>${esc(text)}</h2><div class="row mt" style="gap:10px"><button class="btn grow" data-act="close">Annulla</button><button class="btn primary grow" data-act="${act}" data-id="${esc(id)}">${esc(label)}</button></div>`);
}
function jsonEditor(){
  const data = { settings: settings(), customFields: customFields(), pauses: pauses(),
    tasks: [...S.tasks].sort((a,b)=>(a.order??999)-(b.order??999)).map(({id, ...rest}) => ({id, ...rest})) };
  openModal(`<h2>Editor avanzato</h2>
    <p class="tiny muted">Modifica liberamente. Puoi aggiungere campi nuovi alle attività (finiscono nel database così come li scrivi). <b>freqDays</b> = giorni tra una volta e l'altra (null = senza scadenza), <b>lastDoneAt</b> = data in millisecondi, <b>pauses</b> = vacanze (date AAAA-MM-GG).</p>
    <textarea class="code" id="jsonText" spellcheck="false">${esc(JSON.stringify(data, null, 2))}</textarea>
    <div class="switch"><span class="tiny">Elimina le attività che non sono più nel testo</span><input type="checkbox" id="jsonDel"></div>
    <p class="tiny" id="jsonErr" style="color:var(--bad)"></p>
    <button class="btn primary block" data-act="savejson">Salva nel database</button>`);
}
function saveJson(){
  let data; const err = $('#jsonErr');
  try { data = JSON.parse($('#jsonText').value); } catch(e){ err.textContent = 'JSON non valido: '+e.message; return; }
  if (!Array.isArray(data.tasks)) { err.textContent = 'Manca la lista "tasks".'; return; }
  const ops = [], ids = new Set();
  for (const [i, t] of data.tasks.entries()){
    if (!t.name || !t.category) { err.textContent = `L'attività n.${i+1} non ha "name" o "category".`; return; }
    const id = t.id || slug(t.name) || store.newId('tasks'); ids.add(id);
    const {id:_, ...rest} = t;
    ops.push({type:'set', col:'tasks', id, data:{active:true, order:i, custom:{}, ...rest, points:+rest.points||0, freqDays:rest.freqDays ? +rest.freqDays : null}});
  }
  if ($('#jsonDel').checked) S.tasks.filter(t => !ids.has(t.id)).forEach(t => ops.push({type:'delete', col:'tasks', id:t.id}));
  const cfg = {};
  if (data.settings) cfg.settings = data.settings;
  if (Array.isArray(data.customFields)) cfg.customFields = data.customFields;
  if (Array.isArray(data.pauses)) cfg.pauses = data.pauses.map(p => ({id:p.id || store.newId('x'), from:p.from, to:p.to, note:p.note||''}));
  if (Object.keys(cfg).length) ops.push({type:'set', col:'config', id:'main', data:cfg, merge:true});
  store.commit(ops).then(() => toast('Salvato ✅')).catch(e => toast('⚠️ '+e.message));
  closeModal();
}
async function recalcStats(){
  try {
    toast('Ricalcolo in corso…');
    const all = await store.allCompletions();
    const acc = {}; for (const c of all) for (const [uid,d] of Object.entries(statDelta(c))) acc[uid] = deepAdd(acc[uid], d);
    const uids = new Set([...Object.keys(acc), ...S.stats.map(s => s.id)]);
    await store.commit([...uids].map(uid => ({type:'set', col:'stats', id:uid, data:acc[uid] || {total:0}})));
    toast(`✅ Statistiche ricalcolate da ${all.length} attività`);
  } catch(e){ toast('⚠️ '+e.message); }
}
async function exportAll(){
  const data = await store.dumpAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `casa-ciompi-backup-${dateKey(Date.now())}.json`; a.click();
}
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function burst(emojis, n=14){
  const b = document.createElement('div'); b.className = 'burst';
  for (let i=0; i<n; i++){ const s = document.createElement('span'); s.textContent = emojis[i % emojis.length];
    s.style.left = '50%'; s.style.top = '60%';
    s.style.setProperty('--dx', (Math.random()*300-150)+'px'); s.style.setProperty('--dy', (-Math.random()*380-60)+'px'); s.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    b.appendChild(s); }
  document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
}
function confetti(){
  const b = document.createElement('div'); b.className = 'burst';
  const cols = ['#e2673b','#ffc54d','#3b82c4','#2f9e74','#d6457a','#8e5bd0'];
  for (let i=0; i<90; i++){ const s = document.createElement('i');
    s.style.left = (Math.random()*100)+'%'; s.style.top = (-10 - Math.random()*30)+'vh'; s.style.background = cols[i % cols.length];
    s.style.animationDelay = (Math.random()*0.6)+'s'; s.style.animationDuration = (2 + Math.random()*1.5)+'s';
    s.style.setProperty('--dx', (Math.random()*120-60)+'px'); s.style.setProperty('--rot', (Math.random()*900-450)+'deg');
    b.appendChild(s); }
  document.body.appendChild(b); setTimeout(() => b.remove(), 4500);
}
function nextPrize(){
  const a = S._prizeQueue.shift();
  if (!a){ $('#prize').innerHTML = ''; return; }
  $('#prize').innerHTML = `<div class="prize" data-act="closeprize"><div class="box">
    <button class="x" data-act="closeprize" aria-label="Chiudi">✕</button>
    <div class="k">🎉 Premio sbloccato!</div>
    <div class="rays">${badge(a, 130)}</div>
    <h2>${esc(a.name)}</h2>
    <p class="sub" style="margin:0 0 8px">${esc(a.desc)}</p>
    <span class="pill">${TIERS[a.tier||0]}${a.scope==='couple'?' · di coppia':''}</span>
    ${a.more > 0 ? `<p class="tiny muted">…e altri ${a.more} premi! Li trovi nella pagina Premi.</p>` : ''}
    <button class="btn primary block mt" data-act="closeprize">Evviva! 🥳</button>
  </div></div>`;
  confetti();
}

/* ---------------- eventi ---------------- */
document.addEventListener('click', e => {
  const pick = e.target.closest('.swatches button');
  if (pick){ const box = pick.parentElement; box.querySelectorAll('button').forEach(b => b.classList.remove('on')); pick.classList.add('on');
    box.nextElementSibling.value = pick.dataset.val; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if ((act === 'scrim' || act === 'closeprize') && e.target !== el && el.tagName !== 'BUTTON') return;
  switch (act){
    case 'tab': S.tab = el.dataset.v; location.hash = S.tab; render(); window.scrollTo(0,0); break;
    case 'cat': S.cat = el.dataset.v; render(); break;
    case 'open': openTask(id); break;
    case 'done': { const w = el.dataset.who, o = other();
      completeTask(id, w==='me' ? [S.user.uid] : w==='other' ? [o.uid] : [S.user.uid, o.uid]); break; }
    case 'resetone': resetTasks([id], Date.now()); break;
    case 'resetmodal': resetModal(); break;
    case 'pick': pickTask(); break;
    case 'editlog': editLog(id); break;
    case 'askdellog': { const c = S.completions.find(x => x.id === id); confirmBox(`Eliminare "${c?.taskName}"? ${c && !isReset(c) ? 'I punti verranno tolti.' : ''}`, 'dellog', id, 'Elimina'); break; }
    case 'dellog': deleteCompletion(id); break;
    case 'scrim': case 'close': closeModal(); break;
    case 'closeprize': nextPrize(); break;
    case 'toggle': { const k = el.dataset.k; const cur = S.open[k] ?? (k === 'base' || S.achFilter !== 'all'); S.open[k] = !cur; render(); break; }
    case 'achview': S.achView = el.dataset.v; render(); break;
    case 'achfilter': S.achFilter = el.dataset.v; render(); break;
    case 'addpause': addPause(); break;
    case 'askdelpause': confirmBox('Eliminare questa pausa?', 'delpause', id, 'Elimina'); break;
    case 'delpause': store.commit([{type:'set', col:'config', id:'main', data:{pauses:pauses().filter(p => p.id !== id)}, merge:true}]); closeModal(); break;
    case 'edittask': editTask(id); break;
    case 'askdeltask': confirmBox('Eliminare questa attività? Lo storico dei punti resta.', 'deltask', id, 'Elimina'); break;
    case 'deltask': store.commit([{type:'delete', col:'tasks', id}]); closeModal(); toast('Eliminata'); break;
    case 'editsettings': editSettings(); break;
    case 'defaults': store.commit([{type:'set', col:'config', id:'main', data:{settings:DEFAULT_SETTINGS}, merge:true}]); closeModal(); toast('Regole ripristinate'); break;
    case 'editprofile': editProfile(); break;
    case 'addfield': addField(); break;
    case 'delfield': { const f = customFields().filter((_,i) => i !== +el.dataset.i); store.commit([{type:'set', col:'config', id:'main', data:{customFields:f}, merge:true}]); break; }
    case 'json': jsonEditor(); break;
    case 'savejson': saveJson(); break;
    case 'export': exportAll(); break;
    case 'recalc': recalcStats(); break;
    case 'logout': store.signOut(); break;
    case 'switchuser': store.switchUser(); break;
    case 'resetdemo': store.resetDemo(); break;
    case 'authmode': S.authMode = S.authMode==='login' ? 'signup' : 'login'; S.authMsg=''; render(); break;
    case 'reset': { const email = $('#authForm [name=email]').value; if (!email){ S.authMsg = 'Scrivi prima la tua email.'; render(); break; }
      store.reset(email).then(() => toast('Ti ho mandato una email per reimpostarla 📬')).catch(err => { S.authMsg = authError(err); render(); }); break; }
  }
});
document.addEventListener('change', e => {
  if (e.target.name === 'fu'){ const n = e.target.form.fn; n.disabled = e.target.value === 'none'; if (!n.disabled && !n.value) n.value = 1; }
});
function authError(err){
  const c = err.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Email o password sbagliate.';
  if (c.includes('email-already-in-use')) return 'Esiste già un account con questa email: usa "Entra".';
  if (c.includes('weak-password')) return 'La password deve avere almeno 6 caratteri.';
  if (c.includes('invalid-email')) return 'Email non valida.';
  if (c.includes('too-many-requests')) return 'Troppi tentativi, riprova tra qualche minuto.';
  if (c.includes('network')) return 'Nessuna connessione.';
  return err.message;
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));
  if (f.id === 'authForm'){
    const fn = S.authMode === 'signup' ? store.signUp : store.signIn;
    fn(v.email.trim(), v.pass).catch(err => { S.authMsg = authError(err); render(); });
  }
  if (f.id === 'profileForm'){
    const existing = playersMap()[S.user.uid];
    store.commit([{type:'set', col:'config', id:'main', data:{players:{[S.user.uid]:{name:v.name.trim(), emoji:v.emoji, color:v.color, email:S.user.email, joinedAt:existing?.joinedAt || Date.now()}}}, merge:true}]);
    closeModal();
  }
  if (f.id === 'resetForm'){
    const ids = new FormData(f).getAll('t'); if (!ids.length) return toast('Spunta almeno un’attività');
    const at = v.day === dateKey(Date.now()) ? Date.now() : keyToMs(v.day) + 12*3600000;
    resetTasks(ids, at);
  }
  if (f.id === 'logForm') saveCompletionEdit(f.dataset.id, f);
  if (f.id === 'pauseForm'){
    if (v.to < v.from) return $('#pauseErr').textContent = 'La data di fine è prima di quella di inizio.';
    if (pauses().some(p => !(v.to < p.from || v.from > p.to))) return $('#pauseErr').textContent = 'Si sovrappone a un’altra pausa.';
    store.commit([{type:'set', col:'config', id:'main', data:{pauses:[...pauses(), {id:store.newId('x'), from:v.from, to:v.to, note:(v.note||'').trim()}]}, merge:true}]);
    closeModal(); toast('Pausa salvata 🏖️');
  }
  if (f.id === 'taskForm'){
    const id = f.dataset.id || slug(v.name) + '-' + Math.random().toString(36).slice(2,6);
    const old = S.tasks.find(t => t.id === f.dataset.id) || {};
    const mul = {d:1, w:7, m:30}[v.fu];
    const custom = {...(old.custom||{})};
    customFields().forEach(cf => { const k = 'cf_'+cf.key;
      custom[cf.key] = cf.type==='boolean' ? !!f.elements[k].checked : cf.type==='number' ? (v[k]==='' ? '' : +v[k]) : (v[k]||''); });
    let last = old.lastDoneAt ?? null;
    if (v.last){ const d = new Date(v.last+'T12:00:00').getTime(); if (!old.lastDoneAt || dayStart(old.lastDoneAt) !== dayStart(d)) last = d; } else last = null;
    const data = {...old, name:v.name.trim(), category:v.category.trim(), freqDays: v.fu==='none' ? null : Math.max(1, Math.round(+v.fn*mul)),
      points:+v.points, active:!!f.elements.active.checked, custom, lastDoneAt:last, order: old.order ?? S.tasks.length};
    delete data.id;
    store.commit([{type:'set', col:'tasks', id, data}]).catch(err => toast('⚠️ '+err.message));
    closeModal(); toast('Salvata ✅');
  }
  if (f.id === 'settingsForm'){
    const s = {}; Object.keys(DEFAULT_SETTINGS).forEach(k => s[k] = +v[k]);
    store.commit([{type:'set', col:'config', id:'main', data:{settings:s}, merge:true}]); closeModal(); toast('Regole salvate');
  }
  if (f.id === 'fieldForm'){
    let key = slug(v.label).replace(/-/g,'_') || 'campo'; while (customFields().some(x => x.key === key)) key += '_2';
    store.commit([{type:'set', col:'config', id:'main', data:{customFields:[...customFields(), {key, label:v.label.trim(), type:v.type}]}, merge:true}]); closeModal();
  }
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t && t !== S.tab){ S.tab = t; render(); } });

/* ---------------- avvio ---------------- */
function afterData(){
  S._dataSig = (S._dataSig||0) + 1;
  seedIfNeeded(); upgradeIfNeeded(); archiveIfNeeded(); snapshotDaily(); checkUnlocks();
}
function startSession(u){
  if (unsub) { unsub(); unsub = null; }
  Object.assign(S, {user:u, tasks:[], completions:[], config:null, months:[], stats:[], achievements:[], daily:[], loaded:{}, server:{}, error:null,
    _seeding:false, _archived:false, _upgrading:false, _shown:new Set(), _prizeQueue:[], achView:null});
  $('#prize').innerHTML = '';
  if (u){
    const now = Date.now();
    const q = {since: startOfMonth(startOfMonth(now) - 1), dailySince: dateKey(now - 400*DAY)};
    const mk = name => (data, fromCache) => { S[name] = data; S.loaded[name] = true; if (!fromCache) S.server[name] = true; afterData(); render(); };
    clearTimeout(S._srvTimer);
    S._srvTimer = setTimeout(() => { if (S.user === u && S.loaded.config){ [...COLS,'config'].forEach(c => { if (S.loaded[c]) S.server[c] = true; }); afterData(); render(); } }, 10000);
    unsub = store.subscribe(q, Object.fromEntries([...COLS,'config'].map(c => [c, mk(c)])),
      err => { S.error = err.code === 'permission-denied' ? 'denied' : err.message; render(); });
  }
  render();
}
(async () => {
  try { store = FIREBASE_CONFIG ? await firebaseStore(FIREBASE_CONFIG) : demoStore(); }
  catch(e){ $('#app').innerHTML = `<div class="login center"><div class="logo">📡</div><h2>Non riesco a collegarmi</h2><p class="muted">Controlla la connessione e riapri l'app.</p><p class="tiny muted">${esc(e.message)}</p></div>`; return; }
  store.onAuth(startSession);
  const tick = () => { if (!$('#modal').innerHTML){ snapshotDaily(); render(); } };
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
